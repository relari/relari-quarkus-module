quarkus:
  log:
    level: INFO
    category:
      "io.quarkus.rest.client":
        level: DEBUG
      "pe.com.relari":
        level: DEBUG
      "org.apache.http":
        level: TRACE
  rest-client:
    logging:
      scope: request-response
      body-limit: 1024
    json-place-holder-api:
      url: https://jsonplaceholder.typicode.com
      scope: jakarta.inject.Singleton
      connect-timeout: 5000
      read-timeout: 5000
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
  hibernate-orm:
    database:
      generation: drop-and-create
    log:
      sql: true
    sql-format: true

  dev-ui:
    enabled: true

greeting:
  message: Hello World

application:
  version: 1.0.0
  name: Quarkus Application
  env: local
  errors:
    default-message: Generic error message
    code: API
    defaultCode: 'API999'
    status:
      # ========================
      # Errores HTTP Genéricos
      # ========================
      BAD_REQUEST:
        description: 'Solicitud inválida o incorrecta.'
        status: 400
      UNAUTHORIZED:
        description: 'Autenticación requerida.'
        status: 401
      FORBIDDEN:
        description: 'Acceso denegado.'
        status: 403
      NOT_FOUND:
        description: 'Recurso no encontrado.'
        status: 404
      CONFLICT:
        description: 'Conflicto con el estado actual del recurso.'
        status: 409
      INTERNAL_SERVER_ERROR:
        description: 'Error interno del servidor.'
        status: 500
    categories:
      # ========================
      # Errores de Peliculas
      MOVIE_NOT_FOUND:
        code: 'MV001'
        description: 'Movie not found.'
        status_code: NOT_FOUND
      MOVIE_SAVE_FAILED:
        code: 'MV002'
        description: 'Error saving the movie.'
        status_code: INTERNAL_SERVER_ERROR
      MOVIE_UPDATE_FAILED:
        code: 'MV003'
        description: 'Error updating the movie.'
        status_code: INTERNAL_SERVER_ERROR
      MOVIE_NOT_INACTIVATED:
        code: 'EM004'
        description: 'Movie no inactivado.'
        status_code: CONFLICT
      MOVIE_NOT_ACTIVATED:
        code: 'EM005'
        description: 'Movie no activado.'
        status_code: CONFLICT
